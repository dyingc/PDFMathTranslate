<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF · DeepSeek</title>
<style>
  /* Without this, width:100% on an <input> excludes its padding and border,
     so the field spills out of its flex column and over the next one. */
  *, *::before, *::after { box-sizing: border-box; }
  :root { color-scheme: light dark; --fg:#1a1a1a; --muted:#6b7280; --line:#e3e3e6; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8ea; --muted:#9aa0a6; --line:#33343a; } }
  body { font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif; color: var(--fg);
         max-width: 680px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin-top: 0; }
  section { border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 20px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  /* Every control type has its own intrinsic height (text input, number input,
     select and button all differ), so pin one height rather than chase them. */
  input, select, button { font: inherit; line-height: 1.35; height: 40px;
         padding: 0 10px; border-radius: 7px; border: 1px solid var(--line);
         background: transparent; color: inherit; width: 100%; }
  input[type=file] { padding: 7px 10px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .field { margin-bottom: 12px; }
  progress { width: 100%; height: 6px; margin: 6px 0 2px; }
  .msg { font-size: 13px; color: var(--muted); min-height: 20px; }
  .err { color: #dc2626; }
  a.dl { display:inline-block; margin-right:12px; color:var(--accent); font-size:13px; }
  .hint { font-size:12px; color:var(--muted); }
  details.mark { margin-top:10px; }
  details.mark > summary { font-size:13px; color:var(--accent); cursor:pointer; }
  details.mark > .hint { margin:6px 0 8px; line-height:1.6; }
  label.dl { cursor:pointer; }
  label.cb { display:flex; align-items:center; gap:7px; font-size:13px;
             margin:3px 0; font-weight:400; color:var(--fg); }
  label.cb input { width:13px; height:13px; margin:0; flex:none; }
  .job { border-top: 1px solid var(--line); padding: 12px 0; }
  .job:first-of-type { border-top: none; padding-top: 0; }
  .job-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .job-name { font-weight: 600; overflow-wrap:anywhere; }
  .del { width:auto; background:none; color:var(--muted); font-size:12px; padding:2px 6px; }
  code { font-size: 12px; overflow-wrap: anywhere; }
  #topBar { margin-bottom: 4px; }
  #topBar input, #topBar select { font-size: 14px; }
</style>
</head>
<body>
<div id="topBar" class="row">
  <div class="field"><label for="uiLang" data-i18n="ui_lang"></label><select id="uiLang"></select></div>
  <div class="field"><label for="workers" data-i18n="workers"></label><input id="workers" type="number" min="1"></div>
  <div class="field"><label for="llmThreads" data-i18n="llm_threads"></label><input id="llmThreads" type="number" min="1"></div>
</div>
<div class="msg" id="topMsg" style="margin-top:-8px"></div>

<h1 data-i18n="title"></h1>
<p class="sub" data-i18n-vendor="subtitle"></p>

<section id="keyBox">
  <div class="field">
    <label for="vendor" data-i18n="vendor"></label>
    <select id="vendor"></select>
  </div>
  <div class="field">
    <label for="baseUrl" data-i18n="base_url"></label>
    <input id="baseUrl" type="text" spellcheck="false" autocomplete="off">
    <div class="hint" data-i18n="base_url_note"></div>
  </div>
  <div class="field">
    <label for="key" data-i18n-vendor="api_key"></label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
  </div>
  <button id="saveKey" data-i18n="save_key"></button>
  <div class="msg" id="keyMsg"></div>
</section>

<section id="mainBox" hidden>
  <div class="field">
    <label for="file" data-i18n="file"></label>
    <input id="file" type="file" accept="application/pdf">
  </div>
  <div class="row">
    <div class="field"><label for="langIn" data-i18n="lang_in"></label><select id="langIn"></select></div>
    <div class="field"><label for="langOut" data-i18n="lang_out"></label><select id="langOut"></select></div>
  </div>
  <div class="row">
    <div class="field"><label for="model" data-i18n="model"></label><select id="model"></select></div>
    <div class="field"><label for="effort" data-i18n="effort"></label><select id="effort"></select></div>
  </div>
  <div class="hint" id="priceHint" style="margin:-6px 0 12px"></div>
  <div class="row">
    <div class="field"><label for="pages" data-i18n="pages"></label><input id="pages" data-i18n-ph="pages_ph"></div>
    <div class="field"><label for="output" data-i18n="output"></label><select id="output"></select></div>
  </div>
  <div class="field">
    <label class="cb"><input type="checkbox" id="cacheRead" checked> <span data-i18n="cache_read"></span></label>
    <label class="cb"><input type="checkbox" id="cacheWrite" checked> <span data-i18n="cache_write"></span></label>
    <div class="hint" data-i18n="cache_note"></div>
  </div>
  <button id="go" data-i18n="start"></button>
  <div class="msg" id="msg"></div>
  <div style="margin-top:10px"><a href="#" id="logout" class="hint" data-i18n="clear_key"></a></div>
</section>

<section id="jobsBox">
  <h2 data-i18n="jobs"></h2>
  <div id="jobs"></div>
  <div class="hint" style="margin-top:14px" id="hints"></div>
</section>

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const LIVE = ['queued', 'running'];
let cfg = null, lang = 'zh', timer = null, lastMsg = null;

// Missing key -> English -> the key itself, so a gap degrades instead of blanking.
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || (I18N.en && I18N.en[key]) || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot() {
  cfg = await (await fetch('/api/config')).json();
  lang = cfg.ui_lang;                     // saved server-side: the first screen is already localised
  $('uiLang').innerHTML = cfg.ui_langs
    .map(c => `<option value="${c}">${esc(cfg.languages[c])}</option>`).join('');
  $('uiLang').value = lang;
  $('uiLang').onchange = async () => {
    lang = $('uiLang').value;
    applyI18n();
    await fetch('/api/ui-lang', { method: 'POST', body: form({ lang }) });
  };
  $('workers').max = cfg.limits.workers[1];
  $('llmThreads').max = cfg.limits.llm_threads[1];
  $('workers').value = cfg.workers;
  $('llmThreads').value = cfg.llm_threads;
  for (const id of ['workers', 'llmThreads']) $(id).addEventListener('change', saveSettings);
  applyI18n();
  restorePrefs();
  toggle(cfg.has_key);
  refresh();
}

// Concurrency is a server setting: saved to disk and applied to running jobs.
async function saveSettings() {
  const body = form({ workers: $('workers').value, llm_threads: $('llmThreads').value });
  const r = await fetch('/api/settings', { method: 'POST', body });
  if (r.ok) {
    cfg.workers = +$('workers').value; cfg.llm_threads = +$('llmThreads').value;
    // Threads are what create the cold start: the opening wave of chunks each
    // settles terminology without seeing what the others chose. Measured on one
    // book, conflicts needing repair went 31 at 8 threads to 4 at 2.
    if (cfg.llm_threads > 2) {
      showMsg('topMsg', 'threads_warn', '', true);
    } else {
      showMsg('topMsg', 'saved', '', false);
      setTimeout(() => showMsg('topMsg', null), 1500);
    }
  } else {
    const e = await errOf(r);
    showMsg('topMsg', e.code, e.raw, true);
    $('workers').value = cfg.workers; $('llmThreads').value = cfg.llm_threads;
  }
}

// Re-renders every piece of text, including the API-key screen and the job list.
function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  // Two strings name the provider, and which one that is changes with the
  // selector above them — the label must not still read DeepSeek while the
  // dropdown says OpenAI.
  renderVendorName();
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);

  fillKeep($('vendor'), Object.entries(cfg.vendors).map(([v, x]) => [v, x.label]));
  if (cfg.vendor) $('vendor').value = cfg.vendor;
  fillKeep($('output'), Object.entries(cfg.outputs).map(([v, k]) => [v, t(k)]));
  renderVendor();
  fillKeep($('langIn'), Object.entries(cfg.languages));
  fillKeep($('langOut'), Object.entries(cfg.languages));

  // Escape first, then swap the placeholders for markup - never the other way round.
  $('hints').innerHTML =
    esc(t('hint_files')).replace('{dir}', `<code>${esc(cfg.data_dir)}</code>`);

  if (lastMsg) showMsg(lastMsg.el, lastMsg.key, lastMsg.raw, lastMsg.isErr);
  render();
}

// A key belongs to one provider, so the models and thinking levels on offer
// are that provider's. Where it offers only one level, the control is shown
// but disabled: greying it out says "not your choice here", where hiding it
// would suggest the setting does not exist.
function renderVendorName() {
  const picked = $('vendor').value || cfg.vendor || cfg.default_vendor;
  const v = cfg.vendors[picked] || {};
  for (const el of document.querySelectorAll('[data-i18n-vendor]')) {
    el.textContent = t(el.dataset.i18nVendor, { vendor: v.label || '' });
  }
  // The address belongs to the provider, so switching provider brings back
  // whatever was last used for that one rather than carrying this one over.
  $('baseUrl').value = v.base_url || '';
  $('baseUrl').placeholder = v.official_url || '';
}

function renderVendor() {
  const v = cfg.vendors[cfg.vendor] || cfg.vendors[cfg.default_vendor];
  fillKeep($('model'), Object.entries(v.models)
    .map(([id, m]) => [id, `${m.label} · ${t(m.hint)}`]));
  fillKeep($('effort'), v.efforts.map(e => [e, t('effort_' + e)]));
  const only = v.efforts.length < 2;
  $('effort').disabled = only;
  if (only) $('effort').value = v.default_effort;
  renderPrice();
}

// Rates depend on the model and on whether we are in peak hours right now.
function renderPrice() {
  const p = cfg.pricing, m = $('model').value, r = p.rates[m];
  if (!r) { $('priceHint').textContent = ''; return; }
  const money = v => `${p.symbols[m] || ''}${v}`;
  $('priceHint').textContent = t('price_hint', {
    period: t('period_' + p.period), model: (cfg.models[m] || {}).label || m,
    miss: money(r.cache_miss), out: money(r.output), hit: money(r.cache_hit),
  }) + ' · ' + t('price_note');
}

// Repopulate a <select> without losing the current selection.
function fillKeep(sel, pairs) {
  const keep = sel.value;
  sel.innerHTML = pairs.map(([v, text]) => `<option value="${v}">${esc(text)}</option>`).join('');
  if (keep && pairs.some(([v]) => v === keep)) sel.value = keep;
}

function toggle(hasKey) { $('keyBox').hidden = hasKey; $('mainBox').hidden = !hasKey; }
const form = obj => Object.entries(obj).reduce((f, [k, v]) => (f.append(k, v), f), new FormData());

// Remember which i18n key a status line came from, so it can be re-translated.
function showMsg(el, key, raw, isErr) {
  lastMsg = key ? { el, key, raw, isErr } : null;
  $(el).textContent = key ? t(key) + (raw ? `: ${raw}` : '') : '';
  $(el).className = 'msg' + (isErr ? ' err' : '');
}
// Reads the error code without consuming the body for the caller.
async function peek(resp) {
  const d = (await resp.clone().json().catch(() => ({}))).detail;
  return typeof d === 'object' && d ? d.code : d;
}

async function errOf(resp) {
  const d = (await resp.json().catch(() => ({}))).detail;
  return typeof d === 'object' && d ? d : { code: d || 'err_unknown_job', raw: '' };
}

// --- form preferences (not secrets) -----------------------------------------
const PREF_KEYS = ['model', 'effort', 'output', 'langIn', 'langOut', 'pages'];
// Deliberately not remembered: both are per-run decisions, and a
// forgotten "don't reuse" would silently re-bill the next document.
function restorePrefs() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('prefs') || '{}'); } catch (e) {}
  for (const k of PREF_KEYS) {
    const el = $(k);
    if (saved[k] === undefined) continue;
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === saved[k])) continue;
    el.value = saved[k];
  }
  if (!saved.effort) {
    const v = cfg.vendors[cfg.vendor] || cfg.vendors[cfg.default_vendor];
    $('effort').value = v.default_effort;
  }
  if (!saved.langIn) $('langIn').value = 'en';
  if (!saved.langOut) $('langOut').value = 'zh';
  for (const k of PREF_KEYS) $(k).addEventListener('change', savePrefs);
  $('model').addEventListener('change', renderPrice);
  $('vendor').addEventListener('change', renderVendorName);
  renderPrice();   // the restored model may differ from the default
}
function savePrefs() {
  localStorage.setItem('prefs',
    JSON.stringify(Object.fromEntries(PREF_KEYS.map(k => [k, $(k).value]))));
}

// --- jobs -------------------------------------------------------------------
let jobs = [];
async function refresh() {
  jobs = (await (await fetch('/api/jobs')).json()).jobs;
  render();
  clearInterval(timer);
  if (jobs.some(j => LIVE.includes(j.status))) timer = setInterval(refresh, 1500);
}

function render() {
  $('jobs').innerHTML = jobs.length ? jobs.map(job).join('')
                                    : `<span class="hint">${esc(t('no_jobs'))}</span>`;
}

function job(j) {
  const pct = Math.round((j.progress || 0) * 100);
  const when = new Date(j.created_at * 1000).toLocaleString(lang);
  let body;
  if (LIVE.includes(j.status)) {
    body = `<progress value="${j.progress || 0}" max="1"></progress>
            <div class="msg">${esc(j.stage || '')} ${pct}%</div>`;
  } else if (j.status === 'done') {
    body = j.kinds.map(k =>
      `<a class="dl" href="/api/jobs/${j.id}/download/${k}">${esc(t('dl_' + k))}</a>`).join('')
      + `<details class="mark">
           <summary>${esc(t('mark_title'))}</summary>
           <div class="hint">${t('mark_how')}</div>
           ${j.has_source
              ? `<a class="dl" href="/api/jobs/${j.id}/source">${esc(t('mark_get'))}</a>`
              : `<div class="hint">${esc(t('mark_nosrc'))}</div>`}
           <label class="dl" for="mk-${j.id}">${esc(t('mark_put'))}</label>
           <input type="file" id="mk-${j.id}" accept="application/pdf"
                  style="display:none" onchange="sendMarks('${j.id}', this)">
         </details>`;
  } else {
    // Stored errors are either an i18n key or a raw exception from the provider.
    const e = j.error || '';
    body = `<div class="msg err">${esc(e.startsWith('err_') ? t(e) : e || t('st_error'))}</div>`;
  }
  let actions = '';
  if (!LIVE.includes(j.status)) {
    if (cfg.resumable.includes(j.status)) {
      actions += `<button class="del" onclick="resume('${j.id}')">${esc(t('resume'))}</button>`;
    }
    actions += `<button class="del" onclick="del('${j.id}')">${esc(t('delete'))}</button>`;
  }
  return `<div class="job">
    <div class="job-head">
      <span class="job-name">${esc(j.name)}.pdf</span>
      <span class="hint">${esc(t('st_' + j.status))} · ${esc(when)}</span>
    </div>
    <div class="hint">${esc(cfg.languages[j.lang_in] || j.lang_in)} → ${esc(cfg.languages[j.lang_out] || j.lang_out)} · ${esc(j.model)} · ${esc(t('effort_' + (j.effort || 'high')))}${j.pages ? ' · p.' + esc(j.pages) : ''}</div>
    ${cost(j)}
    ${body}${actions}
  </div>`;
}

const kilo = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);

function cost(j) {
  if (!j.calls) return '';
  const p = cfg.pricing;
  // Per model, not per app: a DeepSeek job was billed in yuan and an OpenAI
  // one in dollars, and the list shows both at once.
  const sym = p.symbols[j.model] || '';
  const money = `${sym}${j.cost < 0.01 ? j.cost.toFixed(4) : j.cost.toFixed(2)}`;
  const line = (j.priced ? t('cost_approx', { cost: money }) + ' · ' : '')
    + t('tokens_stat', {
        in_: kilo(j.tokens_in_hit + j.tokens_in_miss), hit: kilo(j.tokens_in_hit),
        out: kilo(j.tokens_out), calls: j.calls });
  return `<div class="hint">${esc(line)}</div>`;
}

// Re-runs the job; pdf2zh's paragraph cache means the finished part is free.
async function resume(id) {
  const r = await fetch(`/api/jobs/${id}/resume`, { method: 'POST' });
  if (!r.ok) {
    const e = await errOf(r);
    showMsg('msg', e.code, e.raw, true);
    if (r.status === 401) toggle(false);
  }
  refresh();
}

// Keeps the rectangles from a marked-up copy and translates again. Only the
// coordinates are kept, so the marked file itself never has to be uploaded twice.
async function sendMarks(id, input) {
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  const r = await fetch(`/api/jobs/${id}/regions`, { method: 'POST', body: form });
  input.value = '';
  if (!r.ok) {
    const e = await errOf(r);
    showMsg('msg', e.code, e.raw, true);
    if (r.status === 401) toggle(false);
  } else {
    const d = await r.json();
    showMsg('msg', 'mark_ok', `${d.regions} / ${d.pages}`, false);
  }
  refresh();
}

async function del(id) {
  if (!confirm(t('confirm_delete'))) return;
  await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
  refresh();
}

// --- actions ----------------------------------------------------------------
$('saveKey').onclick = async () => {
  showMsg('keyMsg', 'validating', '', false);
  const vendor = $('vendor').value;
  const r = await fetch('/api/session', { method: 'POST', body: form({
    api_key: $('key').value, vendor, base_url: $('baseUrl').value.trim() }) });
  if (r.ok) {
    $('key').value = '';
    showMsg('keyMsg', null);
    // The models and thinking levels on offer are the new provider's.
    cfg.vendor = vendor;
    // Remember what actually worked, so the field is right after a refresh.
    cfg.vendors[vendor].base_url = $('baseUrl').value.trim()
      || cfg.vendors[vendor].base_url;
    renderVendor();
    renderVendorName();
    toggle(true);
  }
  else { const e = await errOf(r); showMsg('keyMsg', e.code, e.raw, true); }
};

$('logout').onclick = async (e) => {
  e.preventDefault();
  await fetch('/api/session', { method: 'DELETE' });
  toggle(false);
};

$('go').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { showMsg('msg', 'pick_file', '', true); return; }
  const fd = form({
    model: $('model').value, lang_in: $('langIn').value, lang_out: $('langOut').value,
    pages: $('pages').value, output: $('output').value, effort: $('effort').value,
    // Both read the same way round: ticked is the ordinary, thrifty course.
    cache_read: $('cacheRead').checked ? '1' : '0',
    cache_write: $('cacheWrite').checked ? '1' : '0',
  });
  fd.append('file', f);

  $('go').disabled = true;
  showMsg('msg', 'uploading', '', false);
  let r = await fetch('/api/translate', { method: 'POST', body: fd });
  // Uploading a previous translation instead of the original is easy to do and
  // costs double, so it is worth one question.
  if (r.status === 409 && (await peek(r)) === 'err_already_translated') {
    const d = (await r.clone().json().catch(() => ({}))).detail || {};
    if (!confirm(t('already_warn', { pct: d.pct }))) {
      $('go').disabled = false; showMsg('msg', null); return;
    }
    fd.append('confirm_language', '1');
    r = await fetch('/api/translate', { method: 'POST', body: fd });
  }
  // A scanned PDF needs an explicit decision before we spend anything on it.
  if (r.status === 409 && (await peek(r)) === 'err_scanned') {
    if (!confirm(t('scanned_warn'))) { $('go').disabled = false; showMsg('msg', null); return; }
    fd.append('confirm_scanned', '1');
    r = await fetch('/api/translate', { method: 'POST', body: fd });
  }
  $('go').disabled = false;
  if (!r.ok) {
    const e = await errOf(r);
    showMsg('msg', e.code, e.raw, true);
    if (r.status === 401) toggle(false);
    return;
  }
  showMsg('msg', 'submitted', '', false);
  $('file').value = '';
  refresh();
};

boot();
</script>
</body>
</html>
