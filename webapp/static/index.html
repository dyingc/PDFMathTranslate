<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF · DeepSeek</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --muted:#6b7280; --line:#e3e3e6; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8ea; --muted:#9aa0a6; --line:#33343a; } }
  body { font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", sans-serif; color: var(--fg);
         max-width: 680px; margin: 48px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin-top: 0; }
  section { border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-top: 20px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 7px;
         border: 1px solid var(--line); background: transparent; color: inherit; width: 100%; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .field { margin-bottom: 12px; }
  progress { width: 100%; height: 6px; margin: 6px 0 2px; }
  .msg { font-size: 13px; color: var(--muted); min-height: 20px; }
  .err { color: #dc2626; }
  a.dl { display:inline-block; margin-right:12px; color:var(--accent); font-size:13px; }
  .hint { font-size:12px; color:var(--muted); }
  .job { border-top: 1px solid var(--line); padding: 12px 0; }
  .job:first-of-type { border-top: none; padding-top: 0; }
  .job-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .job-name { font-weight: 600; overflow-wrap:anywhere; }
  .del { width:auto; background:none; color:var(--muted); font-size:12px; padding:2px 6px; }
  code { font-size: 12px; overflow-wrap: anywhere; }
  #uiLangBox { max-width: 240px; margin-left: auto; }
</style>
</head>
<body>
<div id="uiLangBox" class="field">
  <label for="uiLang" data-i18n="ui_lang"></label>
  <select id="uiLang"></select>
</div>

<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="subtitle"></p>

<section id="keyBox">
  <div class="field">
    <label for="key" data-i18n="api_key"></label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
  </div>
  <button id="saveKey" data-i18n="save_key"></button>
  <div class="msg" id="keyMsg"></div>
</section>

<section id="mainBox" hidden>
  <div class="field">
    <label for="file" data-i18n="file"></label>
    <input id="file" type="file" accept="application/pdf">
  </div>
  <div class="row">
    <div class="field"><label for="langIn" data-i18n="lang_in"></label><select id="langIn"></select></div>
    <div class="field"><label for="langOut" data-i18n="lang_out"></label><select id="langOut"></select></div>
  </div>
  <div class="row">
    <div class="field"><label for="model" data-i18n="model"></label><select id="model"></select></div>
    <div class="field"><label for="pages" data-i18n="pages"></label><input id="pages" data-i18n-ph="pages_ph"></div>
  </div>
  <div class="field"><label for="output" data-i18n="output"></label><select id="output"></select></div>
  <button id="go" data-i18n="start"></button>
  <div class="msg" id="msg"></div>
  <div style="margin-top:10px"><a href="#" id="logout" class="hint" data-i18n="clear_key"></a></div>
</section>

<section id="jobsBox">
  <h2 data-i18n="jobs"></h2>
  <div id="jobs"></div>
  <div class="hint" style="margin-top:14px" id="hints"></div>
</section>

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const LIVE = ['queued', 'running'];
let cfg = null, lang = 'zh', timer = null, lastMsg = null;

// Missing key -> English -> the key itself, so a gap degrades instead of blanking.
function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || (I18N.en && I18N.en[key]) || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{${k}}`, v);
  return s;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot() {
  cfg = await (await fetch('/api/config')).json();
  lang = cfg.ui_lang;                     // saved server-side: the first screen is already localised
  $('uiLang').innerHTML = cfg.ui_langs
    .map(c => `<option value="${c}">${esc(cfg.languages[c])}</option>`).join('');
  $('uiLang').value = lang;
  $('uiLang').onchange = async () => {
    lang = $('uiLang').value;
    applyI18n();
    await fetch('/api/ui-lang', { method: 'POST', body: form({ lang }) });
  };
  applyI18n();
  restorePrefs();
  toggle(cfg.has_key);
  refresh();
}

// Re-renders every piece of text, including the API-key screen and the job list.
function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);

  fillKeep($('model'), Object.entries(cfg.models)
    .map(([v, m]) => [v, `${m.label} · ${t(m.hint)}`]));
  fillKeep($('output'), Object.entries(cfg.outputs).map(([v, k]) => [v, t(k)]));
  fillKeep($('langIn'), Object.entries(cfg.languages));
  fillKeep($('langOut'), Object.entries(cfg.languages));

  // Escape first, then swap the placeholders for markup - never the other way round.
  $('hints').innerHTML =
    esc(t('hint_files')).replace('{dir}', `<code>${esc(cfg.data_dir)}</code>`)
    + '<br>' +
    esc(t('hint_conc')).replace('{conc}', esc(`${cfg.workers} × ${cfg.llm_threads}`))
                       .replace('{cmd}', '<code>./webapp/start.sh -w N -t N</code>');

  if (lastMsg) showMsg(lastMsg.el, lastMsg.key, lastMsg.raw, lastMsg.isErr);
  render();
}

// Repopulate a <select> without losing the current selection.
function fillKeep(sel, pairs) {
  const keep = sel.value;
  sel.innerHTML = pairs.map(([v, text]) => `<option value="${v}">${esc(text)}</option>`).join('');
  if (keep && pairs.some(([v]) => v === keep)) sel.value = keep;
}

function toggle(hasKey) { $('keyBox').hidden = hasKey; $('mainBox').hidden = !hasKey; }
const form = obj => Object.entries(obj).reduce((f, [k, v]) => (f.append(k, v), f), new FormData());

// Remember which i18n key a status line came from, so it can be re-translated.
function showMsg(el, key, raw, isErr) {
  lastMsg = key ? { el, key, raw, isErr } : null;
  $(el).textContent = key ? t(key) + (raw ? `: ${raw}` : '') : '';
  $(el).className = 'msg' + (isErr ? ' err' : '');
}
async function errOf(resp) {
  const d = (await resp.json().catch(() => ({}))).detail;
  return typeof d === 'object' && d ? d : { code: d || 'err_unknown_job', raw: '' };
}

// --- form preferences (not secrets) -----------------------------------------
const PREF_KEYS = ['model', 'output', 'langIn', 'langOut', 'pages'];
function restorePrefs() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('prefs') || '{}'); } catch (e) {}
  for (const k of PREF_KEYS) {
    const el = $(k);
    if (saved[k] === undefined) continue;
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === saved[k])) continue;
    el.value = saved[k];
  }
  if (!saved.langIn) $('langIn').value = 'en';
  if (!saved.langOut) $('langOut').value = 'zh';
  for (const k of PREF_KEYS) $(k).addEventListener('change', savePrefs);
}
function savePrefs() {
  localStorage.setItem('prefs',
    JSON.stringify(Object.fromEntries(PREF_KEYS.map(k => [k, $(k).value]))));
}

// --- jobs -------------------------------------------------------------------
let jobs = [];
async function refresh() {
  jobs = (await (await fetch('/api/jobs')).json()).jobs;
  render();
  clearInterval(timer);
  if (jobs.some(j => LIVE.includes(j.status))) timer = setInterval(refresh, 1500);
}

function render() {
  $('jobs').innerHTML = jobs.length ? jobs.map(job).join('')
                                    : `<span class="hint">${esc(t('no_jobs'))}</span>`;
}

function job(j) {
  const pct = Math.round((j.progress || 0) * 100);
  const when = new Date(j.created_at * 1000).toLocaleString(lang);
  let body;
  if (LIVE.includes(j.status)) {
    body = `<progress value="${j.progress || 0}" max="1"></progress>
            <div class="msg">${esc(j.stage || '')} ${pct}%</div>`;
  } else if (j.status === 'done') {
    body = j.kinds.map(k =>
      `<a class="dl" href="/api/jobs/${j.id}/download/${k}">${esc(t('dl_' + k))}</a>`).join('');
  } else {
    // Stored errors are either an i18n key or a raw exception from the provider.
    const e = j.error || '';
    body = `<div class="msg err">${esc(e.startsWith('err_') ? t(e) : e || t('st_error'))}</div>`;
  }
  const del = LIVE.includes(j.status) ? ''
    : `<button class="del" onclick="del('${j.id}')">${esc(t('delete'))}</button>`;
  return `<div class="job">
    <div class="job-head">
      <span class="job-name">${esc(j.name)}.pdf</span>
      <span class="hint">${esc(t('st_' + j.status))} · ${esc(when)}</span>
    </div>
    <div class="hint">${esc(cfg.languages[j.lang_in] || j.lang_in)} → ${esc(cfg.languages[j.lang_out] || j.lang_out)} · ${esc(j.model)}${j.pages ? ' · p.' + esc(j.pages) : ''}</div>
    ${body}${del}
  </div>`;
}

async function del(id) {
  if (!confirm(t('confirm_delete'))) return;
  await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
  refresh();
}

// --- actions ----------------------------------------------------------------
$('saveKey').onclick = async () => {
  showMsg('keyMsg', 'validating', '', false);
  const r = await fetch('/api/session', { method: 'POST', body: form({ api_key: $('key').value }) });
  if (r.ok) { $('key').value = ''; showMsg('keyMsg', null); toggle(true); }
  else { const e = await errOf(r); showMsg('keyMsg', e.code, e.raw, true); }
};

$('logout').onclick = async (e) => {
  e.preventDefault();
  await fetch('/api/session', { method: 'DELETE' });
  toggle(false);
};

$('go').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { showMsg('msg', 'pick_file', '', true); return; }
  const fd = form({
    model: $('model').value, lang_in: $('langIn').value, lang_out: $('langOut').value,
    pages: $('pages').value, output: $('output').value,
  });
  fd.append('file', f);

  $('go').disabled = true;
  showMsg('msg', 'uploading', '', false);
  const r = await fetch('/api/translate', { method: 'POST', body: fd });
  $('go').disabled = false;
  if (!r.ok) {
    const e = await errOf(r);
    showMsg('msg', e.code, e.raw, true);
    if (r.status === 401) toggle(false);
    return;
  }
  showMsg('msg', 'submitted', '', false);
  $('file').value = '';
  refresh();
};

boot();
</script>
</body>
</html>
